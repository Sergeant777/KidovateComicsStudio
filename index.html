<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kidovate | Dummy 13 Comic Studio</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
        .font-comic { font-family: 'Bangers', cursive; letter-spacing: 0.05em; }
        body { background-color: #020617; color: white; font-family: sans-serif; overflow-x: hidden; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        #viewport-frame {
            height: 550px;
            width: 100%;
            background-color: #1e293b;
            position: relative;
            border: 8px solid #000;
            border-radius: 40px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        #hero-container {
            position: absolute;
            cursor: move;
            user-select: none;
            z-index: 40;
            width: 320px;
            height: 400px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .speech-bubble {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            background: white; border: 4px solid black; border-radius: 40px;
            padding: 15px 30px; text-align: center; font-weight: 900;
            color: black; font-size: 1.5rem; text-transform: uppercase;
            box-shadow: 10px 10px 0px rgba(0,0,0,1); z-index: 100;
            max-width: 80%; display: none; line-height: 1.1; font-family: 'Bangers', cursive;
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -20px; left: 50%;
            border-width: 20px 20px 0 0; border-style: solid;
            border-color: white transparent transparent transparent;
            transform: translateX(-50%);
        }

        .panel-thumb { border: 4px solid black; border-radius: 15px; overflow: hidden; background: white; flex-shrink: 0; width: 220px; position: relative; aspect-ratio: 4/5; }
        
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { background: #334155; height: 8px; border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #06b6d4; margin-top: -6px; border: 2px solid white; }

        .btn-tab.active { background-color: #06b6d4; color: black; box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
        .hidden-tab { display: none !important; }
    </style>
</head>
<body class="selection:bg-cyan-500/30">

    <nav class="bg-black border-b-4 border-cyan-500 sticky top-0 z-[100] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-500 text-black px-3 py-1 rounded-lg font-black text-2xl italic rotate-2 font-comic">K</div>
                <h1 class="text-3xl font-black italic tracking-tighter text-white font-comic uppercase">KIDOVATE <span class="text-cyan-400">STUDIO</span></h1>
            </div>
            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button onclick="switchTab('studio')" id="tab-studio" class="btn-tab active flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-black uppercase transition-all">
                    <i data-lucide="layout" class="w-4 h-4"></i> Studio
                </button>
                <button onclick="switchTab('brag')" id="tab-brag" class="btn-tab flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-black uppercase transition-all">
                    <i data-lucide="star" class="w-4 h-4"></i> Gallery
                </button>
                <button onclick="switchTab('about')" id="tab-about" class="btn-tab flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-black uppercase transition-all">
                    <i data-lucide="info" class="w-4 h-4"></i> About
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4">
        <!-- STUDIO TAB -->
        <div id="content-studio" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-3 space-y-6 bg-slate-900 p-5 rounded-[40px] border border-slate-800 shadow-2xl h-fit">
                <section>
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-cyan-400 font-black text-xs uppercase flex items-center gap-2"><i data-lucide="plus" class="w-3 h-3"></i> 1. Hero</h3>
                        <button onclick="document.getElementById('hero-upload').click()" class="text-[9px] font-black uppercase bg-slate-800 px-2 py-1 rounded border border-slate-700">Upload</button>
                        <input id="hero-upload" type="file" class="hidden" accept="image/*" onchange="handleHeroUpload(event)">
                    </div>
                    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide" id="hero-gallery"></div>
                </section>

                <section class="bg-black/20 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-cyan-400 font-black text-xs uppercase">2. Background</h3>
                        <button onclick="document.getElementById('bg-upload').click()" class="text-[9px] font-black uppercase bg-slate-800 px-2 py-1 rounded border border-slate-700"><i data-lucide="upload" class="w-3 h-3"></i></button>
                        <input id="bg-upload" type="file" class="hidden" accept="image/*" onchange="handleBgUpload(event)">
                    </div>
                    <div class="flex gap-2 flex-wrap" id="color-palette"></div>
                </section>

                <section class="bg-black/20 p-4 rounded-3xl border border-slate-800 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-cyan-400 font-black text-xs uppercase">3. Assets</h3>
                        <button onclick="document.getElementById('asset-upload').click()" class="text-[9px] font-black uppercase bg-slate-800 px-2 py-1 rounded border border-slate-700"><i data-lucide="plus" class="w-3 h-3"></i></button>
                        <input id="asset-upload" type="file" class="hidden" accept="image/*" onchange="handleAssetUpload(event)">
                    </div>
                    <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide" id="asset-library"></div>
                    <p class="text-[8px] text-slate-500 uppercase mt-1">Double-tap asset on stage to delete</p>
                </section>

                <section class="space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-cyan-400 font-black text-xs uppercase">4. Controls</h3>
                        <div class="flex gap-2">
                            <button onclick="flipHero()" class="bg-slate-800 p-2 rounded-xl" title="Flip"><i data-lucide="flip-horizontal" class="w-4 h-4"></i></button>
                            <button onclick="resetHero()" class="bg-slate-800 p-2 rounded-xl" title="Reset Position"><i data-lucide="rotate-ccw" class="w-4 h-4"></i></button>
                        </div>
                    </div>
                    <input type="range" min="0.1" max="4" step="0.1" value="1" id="scale-slider" oninput="updateHeroScale(this.value)">
                    <input type="range" min="-180" max="180" step="1" value="0" id="rotate-slider" oninput="updateHeroRotation(this.value)">
                    
                    <div class="flex justify-between items-center mt-4">
                        <h3 class="text-cyan-400 font-black text-xs uppercase">Dialogue</h3>
                        <button onclick="speakDialogue()" class="flex items-center gap-1 text-[9px] font-black uppercase px-2 py-1 rounded border bg-slate-800 border-slate-700 text-slate-400"><i data-lucide="volume-2" class="w-3 h-3"></i> Speak</button>
                    </div>
                    <textarea id="dialogue-input" oninput="updateSpeech(this.value)" placeholder="SAY SOMETHING..." class="w-full bg-black border-2 border-slate-800 rounded-2xl p-3 text-sm font-black uppercase text-white outline-none h-16 resize-none"></textarea>
                </section>

                <button onclick="generateIdea()" class="w-full bg-slate-800 py-3 rounded-2xl text-[10px] font-black uppercase border border-slate-700">💡 Idea Engine</button>
                <button onclick="takeSnap()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 py-4 rounded-2xl text-xl font-black uppercase shadow-xl active:scale-95 transition-all"><i data-lucide="camera" class="inline w-6 h-6 mr-2"></i> SNAP PANEL!</button>
            </div>

            <div class="lg:col-span-9 flex flex-col gap-6">
                <div id="viewport-frame">
                    <div id="speech-bubble" class="speech-bubble"></div>
                    <!-- The grabbable container -->
                    <div id="hero-container" onmousedown="startHeroDrag(event)" ontouchstart="startHeroDrag(event)"></div>
                    <div class="absolute bottom-8 right-10 opacity-10 font-black italic text-6xl text-white pointer-events-none uppercase font-comic">KIDOVATE</div>
                    <div id="lore-popup" class="absolute bottom-6 left-6 right-6 bg-cyan-500 text-black p-4 rounded-3xl border-4 border-black shadow-2xl hidden flex justify-between items-center z-[101]">
                        <p id="lore-text" class="font-black text-xs uppercase italic"></p>
                        <button onclick="closeLore()" class="bg-black text-white px-4 py-2 rounded-full font-black text-[10px]">OK</button>
                    </div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-[50px] p-8 shadow-2xl">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
                        <h4 class="font-black uppercase tracking-widest text-sm text-emerald-500 italic">COMIC STRIP REEL</h4>
                        <div class="flex gap-3">
                            <button onclick="clearReel()" class="text-[10px] font-black text-red-500 uppercase px-6 py-3 hover:bg-red-500/10 rounded-2xl">Clear Reel</button>
                            <button onclick="downloadComic()" class="bg-emerald-600 hover:bg-emerald-500 px-8 py-3 rounded-2xl text-[10px] font-black uppercase shadow-xl flex items-center gap-3">
                                <i data-lucide="download" class="w-4 h-4"></i> Save Full Comic
                            </button>
                        </div>
                    </div>
                    <div id="strip-reel-container" class="flex gap-6 overflow-x-auto pb-6 scrollbar-hide min-h-[200px]">
                        <div class="w-full py-16 text-center border-4 border-dashed border-slate-800 rounded-[40px] opacity-20 uppercase font-black italic">Snap your first panel!</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- GALLERY TAB -->
        <div id="content-brag" class="hidden-tab py-24 text-center space-y-12 animate-in fade-in">
            <h2 class="text-7xl font-black text-white font-comic uppercase tracking-tighter">The Gallery</h2>
            <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                <div class="col-span-full bg-slate-900 border-4 border-dashed border-slate-800 rounded-[60px] p-20 opacity-30 italic font-black uppercase text-2xl">Gallery is currently empty.</div>
            </div>
        </div>

        <!-- ABOUT TAB -->
        <div id="content-about" class="hidden-tab max-w-3xl mx-auto py-16 bg-slate-900 p-12 rounded-[60px] border border-slate-800 shadow-2xl space-y-6">
            <h2 id="about-title" class="text-6xl font-black italic text-white mb-8 uppercase font-comic">About Kidovate</h2>
            <p id="about-desc" class="text-slate-300 font-bold leading-loose text-lg"></p>
            <div class="h-px bg-slate-800 my-8"></div>
            <p id="about-mission" class="text-cyan-500 font-black uppercase text-sm italic"></p>
        </div>
    </main>

    <script>
        const ADMIN_CONFIG = {
            about: {
                title: "The Kidovate Way",
                description: "Kidovate is about turning 3D engineering into digital magic. Build your Dummy 13 frame, then use this studio to tell their legendary story.",
                mission: "Empowering young creators to bridge physical play and digital media."
            },
            featuredComics: [],
            ideaEngine: {
                who: ["Blue Guardian", "Rogue Dummy 13", "Armor Master", "Robot Scout", "Golden Hero", "Commander Frame"],
                action: ["is searching for", "just discovered", "is protecting", "wants to trade", "is practicing moves with", "is hiding from"],
                what: ["the 3D print", "a micro-chip", "spare armor", "secret instructions", "a human battery", "forbidden filament"],
                location: ["on the Moon.", "in the bedroom.", "inside the printer.", "at the disco.", "in the kitchen.", "under the bed."]
            }
        };

        const HERO_POSES = [
            { id: 'p1', svg: `<svg viewBox="0 0 100 150"><circle cx="50" cy="22" r="6" fill="#06f"/><rect x="47" y="28" width="6" height="50" fill="#06f"/><path d="M40 78 L40 130 M60 78 L60 130 M30 40 L15 80 M70 40 L85 80" stroke-width="6" stroke="#06f" fill="none"/><path d="M38 35 Q50 32 62 35 L64 75 Q50 78 36 75 Z" fill="#000"/><path d="M45 18 L55 18 L58 32 L42 32 Z" fill="#000"/><rect x="35" y="85" width="12" height="25" rx="3" fill="#000"/><rect x="53" y="85" width="12" height="25" rx="3" fill="#000"/><rect x="24" y="42" width="10" height="20" rx="3" fill="#000"/><rect x="66" y="42" width="10" height="20" rx="3" fill="#000"/></svg>` },
            { id: 'p2', svg: `<svg viewBox="0 0 100 150"><path d="M50 80 L30 110 L45 130 M50 80 L70 100 L60 135 M45 45 L20 35 L30 15 M55 45 L85 60 L75 80" stroke-width="7" stroke="#06f" fill="none"/><circle cx="62" cy="28" r="7" fill="#06f"/><rect x="40" y="40" width="24" height="40" rx="4" transform="rotate(-10 50 60)" fill="#000"/><rect x="25" y="105" width="14" height="25" transform="rotate(30 30 115)" fill="#000"/><rect x="65" y="95" width="14" height="25" transform="rotate(-20 70 105)" fill="#000"/></svg>` },
            { id: 'p3', svg: `<svg viewBox="0 0 100 150"><path d="M40 85 L40 125 M55 85 L95 75 L95 90 M35 50 L10 60 L20 80 M60 50 L85 40 L90 20" stroke-width="8" stroke="#06f" fill="none"/><circle cx="55" cy="30" r="10" fill="#06f"/><rect x="35" y="45" width="24" height="40" rx="4" transform="rotate(10 45 65)" fill="#000"/></svg>` }
        ];

        const ASSETS = [
            { id: 'sword', svg: `<svg viewBox="0 0 100 100"><path d="M50 10 L60 80 L50 90 L40 80 Z" fill="#94a3b8" stroke="black" stroke-width="2"/></svg>` },
            { id: 'shield', svg: `<svg viewBox="0 0 100 100"><path d="M20 20 Q50 10 80 20 L75 70 Q50 90 25 70 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="4"/></svg>` },
            { id: 'pow', svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#ef4444" stroke="black" stroke-width="3"/><text x="50" y="58" text-anchor="middle" font-family="Bangers" font-size="22" fill="white" font-weight="bold">POW</text></svg>` }
        ];

        let heroState = { scale: 1, rotation: 0, flipped: false, posX: 0, posY: 0 };
        let isDraggingHero = false;
        let dragOffset = { x: 0, y: 0 };
        let panels = [];

        function init() {
            lucide.createIcons();
            setupColorPalette();
            setupAssetLibrary();
            loadGallery();
            loadAbout();
            selectPose(0);

            // Global move/end events for robust dragging
            window.addEventListener('mousemove', handleMove);
            window.addEventListener('touchmove', handleMove, { passive: false });
            window.addEventListener('mouseup', handleEnd);
            window.addEventListener('touchend', handleEnd);
        }

        // --- NAVIGATION ---
        function switchTab(id) {
            document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            
            document.getElementById('content-studio').classList.add('hidden-tab');
            document.getElementById('content-brag').classList.add('hidden-tab');
            document.getElementById('content-about').classList.add('hidden-tab');
            
            document.getElementById('content-' + id).classList.remove('hidden-tab');
        }

        // --- HERO DRAGGING ---
        function startHeroDrag(e) {
            isDraggingHero = true;
            const cx = e.touches ? e.touches[0].clientX : e.clientX;
            const cy = e.touches ? e.touches[0].clientY : e.clientY;
            dragOffset.x = cx - heroState.posX;
            dragOffset.y = cy - heroState.posY;
        }

        function handleMove(e) {
            if (isDraggingHero) {
                if (e.touches) e.preventDefault();
                const cx = e.touches ? e.touches[0].clientX : e.clientX;
                const cy = e.touches ? e.touches[0].clientY : e.clientY;
                heroState.posX = cx - dragOffset.x;
                heroState.posY = cy - dragOffset.y;
                applyTransform();
            }
        }

        function handleEnd() { isDraggingHero = false; }

        function applyTransform() {
            const el = document.getElementById('hero-container');
            const flip = heroState.flipped ? -1 : 1;
            el.style.transform = `translate(${heroState.posX}px, ${heroState.posY}px) scale(${heroState.scale * flip}, ${heroState.scale}) rotate(${heroState.rotation}deg)`;
        }

        // --- ASSET DRAGGING (Sticker Logic) ---
        function addAssetToStage(svg, imgData) {
            const frame = document.getElementById('viewport-frame');
            const asset = document.createElement('div');
            asset.className = "absolute cursor-move z-[50]";
            asset.style.width = "120px";
            asset.style.height = "120px";
            asset.style.left = "50%";
            asset.style.top = "50%";
            
            if (svg) asset.innerHTML = svg;
            else asset.innerHTML = `<img src="${imgData}" class="w-full h-full object-contain pointer-events-none">`;

            // Simple Local Drag
            let isMoving = false;
            let offset = { x: 0, y: 0 };

            asset.onmousedown = (e) => {
                isMoving = true;
                const rect = asset.getBoundingClientRect();
                offset.x = e.clientX - rect.left;
                offset.y = e.clientY - rect.top;
            };

            window.addEventListener('mousemove', (e) => {
                if (!isMoving) return;
                const frameRect = frame.getBoundingClientRect();
                asset.style.left = (e.clientX - frameRect.left - offset.x) + "px";
                asset.style.top = (e.clientY - frameRect.top - offset.y) + "px";
            });

            window.addEventListener('mouseup', () => { isMoving = false; });
            
            // Delete on double click
            asset.ondblclick = () => asset.remove();
            frame.appendChild(asset);
        }

        // --- CONTROLS ---
        function selectPose(idx) {
            const container = document.getElementById('hero-container');
            container.innerHTML = `<div style="width:100%; height:100%; pointer-events:none;">${HERO_POSES[idx].svg}</div>`;
            resetHero();
        }

        function resetHero() {
            heroState = { scale: 1, rotation: 0, flipped: false, posX: 0, posY: 0 };
            document.getElementById('scale-slider').value = 1;
            document.getElementById('rotate-slider').value = 0;
            applyTransform();
        }

        function updateHeroScale(v) { heroState.scale = v; applyTransform(); }
        function updateHeroRotation(v) { heroState.rotation = v; applyTransform(); }
        function flipHero() { heroState.flipped = !heroState.flipped; applyTransform(); }

        function handleHeroUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (ev) => {
                const container = document.getElementById('hero-container');
                container.innerHTML = `<img src="${ev.target.result}" class="max-w-full max-h-full drop-shadow-2xl pointer-events-none">`;
                resetHero();
            };
            r.readAsDataURL(file);
        }

        function handleBgUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (ev) => {
                const f = document.getElementById('viewport-frame');
                f.style.backgroundImage = `url(${ev.target.result})`;
                f.style.backgroundSize = "cover";
                f.style.backgroundPosition = "center";
            };
            r.readAsDataURL(file);
        }

        function handleAssetUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const r = new FileReader();
            r.onload = (ev) => addAssetToStage(null, ev.target.result);
            r.readAsDataURL(file);
        }

        function setupColorPalette() {
            const colors = ['#1e293b', '#000000', '#ffffff', '#ffcc00', '#ef4444', '#06b6d4'];
            const container = document.getElementById('color-palette');
            colors.forEach(c => {
                const b = document.createElement('button');
                b.className = "w-6 h-6 rounded-lg border-2 border-slate-700";
                b.style.background = c;
                b.onclick = () => {
                    const f = document.getElementById('viewport-frame');
                    f.style.backgroundImage = 'none';
                    f.style.backgroundColor = c;
                };
                container.appendChild(b);
            });
        }

        function setupAssetLibrary() {
            const list = document.getElementById('asset-library');
            const poses = document.getElementById('hero-gallery');
            
            // Build Pose buttons
            HERO_POSES.forEach((p, i) => {
                const b = document.createElement('button');
                b.className = "shrink-0 w-16 h-16 rounded-2xl border-2 border-slate-800 p-1 bg-black hover:border-cyan-500";
                b.innerHTML = p.svg;
                b.onclick = () => selectPose(i);
                poses.appendChild(b);
            });

            // Build Asset buttons
            ASSETS.forEach(a => {
                const b = document.createElement('button');
                b.className = "shrink-0 w-12 h-12 rounded-xl bg-black border border-slate-800 p-2 hover:border-cyan-500";
                b.innerHTML = a.svg;
                b.onclick = () => addAssetToStage(a.svg);
                list.appendChild(b);
            });
        }

        // --- COMIC ACTIONS ---
        function updateSpeech(v) {
            const b = document.getElementById('speech-bubble');
            b.innerText = v;
            b.style.display = v.trim() ? 'block' : 'none';
        }

        function speakDialogue() {
            const t = document.getElementById('dialogue-input').value;
            if (!t.trim()) return;
            const u = new SpeechSynthesisUtterance(t);
            u.pitch = 0.5;
            window.speechSynthesis.speak(u);
        }

        async function takeSnap() {
            const f = document.getElementById('viewport-frame');
            const c = await html2canvas(f, { backgroundColor: null, scale: 2 });
            const img = c.toDataURL("image/png");
            
            const reel = document.getElementById('strip-reel-container');
            if (panels.length === 0) reel.innerHTML = '';
            
            const div = document.createElement('div');
            div.className = "panel-thumb";
            div.innerHTML = `<img src="${img}" class="w-full h-full object-cover">`;
            reel.appendChild(div);
            panels.push(img);
            
            document.getElementById('dialogue-input').value = '';
            updateSpeech('');
        }

        async function downloadComic() {
            if (panels.length === 0) return;
            const reel = document.getElementById('strip-reel-container');
            const c = await html2canvas(reel, { backgroundColor: '#000000', scale: 2 });
            const l = document.createElement('a');
            l.download = `Kidovate_Comic_${Date.now()}.png`;
            l.href = c.toDataURL("image/png");
            l.click();
        }

        function clearReel() {
            if (confirm("Clear all panels and reset stage?")) {
                panels = [];
                document.getElementById('strip-reel-container').innerHTML = '<div class="w-full py-16 text-center border-4 border-dashed border-slate-800 rounded-[40px] opacity-20 uppercase font-black italic">Snap your first panel!</div>';
                resetHero();
                document.getElementById('viewport-frame').style.backgroundImage = 'none';
                document.getElementById('viewport-frame').style.backgroundColor = '#1e293b';
                // Clear any props
                const props = document.querySelectorAll('.cursor-move.z-[50]');
                props.forEach(p => p.remove());
            }
        }

        function generateIdea() {
            const p = ADMIN_CONFIG.ideaEngine;
            const m = `${p.who[Math.floor(Math.random()*p.who.length)]} ${p.action[Math.floor(Math.random()*p.action.length)]} ${p.what[Math.floor(Math.random()*p.what.length)]} ${p.location[Math.floor(Math.random()*p.location.length)]}`;
            document.getElementById('lore-text').innerText = m;
            document.getElementById('lore-popup').classList.remove('hidden');
        }

        function closeLore() { document.getElementById('lore-popup').classList.add('hidden'); }

        function loadGallery() {
            const grid = document.getElementById('gallery-grid');
            if (ADMIN_CONFIG.featuredComics.length > 0) {
                grid.innerHTML = '';
                ADMIN_CONFIG.featuredComics.forEach(c => {
                    grid.innerHTML += `<div class="bg-slate-900 p-2 rounded-[40px] border-4 border-slate-800"><img src="${c.img}" class="rounded-[30px] w-full"><div class="p-4 text-left"><p class="font-black uppercase text-cyan-400">${c.title}</p><p class="text-[10px] font-bold">By ${c.author}</p></div></div>`;
                });
            }
        }

        function loadAbout() {
            document.getElementById('about-title').innerText = ADMIN_CONFIG.about.title;
            document.getElementById('about-desc').innerText = ADMIN_CONFIG.about.description;
            document.getElementById('about-mission').innerText = ADMIN_CONFIG.about.mission;
        }

        window.onload = init;
    </script>
</body>
</html>
