<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kidovate | Dummy 13 Comic Studio</title>
    <!-- Dependencies -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bangers&display=swap');
        .font-comic { font-family: 'Bangers', cursive; letter-spacing: 0.05em; }
        body { background-color: #020617; color: white; font-family: sans-serif; overflow-x: hidden; touch-action: none; }
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        
        #viewport-frame {
            height: 550px;
            width: 100%;
            background-color: #1e293b;
            position: relative;
            border: 8px solid #000;
            border-radius: 40px;
            overflow: hidden;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        /* Movable items (Heroes and Assets) */
        .movable {
            position: absolute;
            cursor: move;
            user-select: none;
            touch-action: none;
            z-index: 40;
            width: 200px;
            height: 250px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid transparent;
        }
        
        .movable.selected {
            border: 2px dashed #06b6d4;
            border-radius: 20px;
            background: rgba(6, 182, 212, 0.1);
        }

        .movable * { pointer-events: none; } /* Prevents child parts from blocking the drag */

        .speech-bubble {
            position: absolute; top: 10%; left: 50%; transform: translateX(-50%);
            background: white; border: 4px solid black; border-radius: 40px;
            padding: 15px 30px; text-align: center; font-weight: 900;
            color: black; font-size: 1.5rem; text-transform: uppercase;
            box-shadow: 10px 10px 0px rgba(0,0,0,1); z-index: 100;
            max-width: 80%; display: none; line-height: 1.1; font-family: 'Bangers', cursive;
            pointer-events: none;
        }
        .speech-bubble::after {
            content: ''; position: absolute; bottom: -20px; left: 50%;
            border-width: 20px 20px 0 0; border-style: solid;
            border-color: white transparent transparent transparent;
            transform: translateX(-50%);
        }

        .panel-thumb { border: 4px solid black; border-radius: 15px; overflow: hidden; background: white; flex-shrink: 0; width: 220px; position: relative; aspect-ratio: 4/5; }
        
        input[type=range] { -webkit-appearance: none; background: transparent; width: 100%; cursor: pointer; }
        input[type=range]::-webkit-slider-runnable-track { background: #334155; height: 8px; border-radius: 4px; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #06b6d4; margin-top: -6px; border: 2px solid white; }

        .btn-tab.active { background-color: #06b6d4; color: black; box-shadow: 0 0 15px rgba(6, 182, 212, 0.4); }
        .hidden-tab { display: none !important; }
    </style>
</head>
<body class="selection:bg-cyan-500/30">

    <nav class="bg-black border-b-4 border-cyan-500 sticky top-0 z-[100] px-4 py-3 shadow-xl">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="bg-cyan-500 text-black px-3 py-1 rounded-lg font-black text-2xl italic rotate-2 font-comic">K</div>
                <h1 class="text-3xl font-black italic tracking-tighter text-white font-comic uppercase">KIDOVATE <span class="text-cyan-400">STUDIO</span></h1>
            </div>
            <div class="flex bg-slate-900 p-1 rounded-xl border border-slate-800">
                <button onclick="switchTab('studio')" id="tab-studio" class="btn-tab active flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-black uppercase transition-all">
                    <i data-lucide="layout" class="w-4 h-4"></i> Studio
                </button>
                <button onclick="switchTab('brag')" id="tab-brag" class="btn-tab flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-black uppercase transition-all">
                    <i data-lucide="star" class="w-4 h-4"></i> Gallery
                </button>
                <button onclick="switchTab('about')" id="tab-about" class="btn-tab flex items-center gap-2 px-4 py-2 rounded-lg text-xs font-black uppercase transition-all">
                    <i data-lucide="info" class="w-4 h-4"></i> About
                </button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto p-4">
        <!-- STUDIO TAB -->
        <div id="content-studio" class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- Sidebar -->
            <div class="lg:col-span-3 space-y-6 bg-slate-900 p-5 rounded-[40px] border border-slate-800 shadow-2xl h-fit">
                
                <!-- 1. Characters -->
                <section>
                    <div class="flex justify-between items-center mb-3">
                        <h3 class="text-cyan-400 font-black text-xs uppercase flex items-center gap-2"><i data-lucide="user-plus" class="w-3 h-3"></i> 1. Characters</h3>
                        <button onclick="document.getElementById('hero-upload').click()" class="text-[9px] font-black uppercase bg-slate-800 px-2 py-1 rounded border border-slate-700 hover:text-white">Add Photo</button>
                        <input id="hero-upload" type="file" class="hidden" accept="image/*" onchange="handleHeroUpload(event)">
                    </div>
                    <div class="flex gap-2 overflow-x-auto pb-2 scrollbar-hide" id="hero-gallery"></div>
                </section>

                <!-- 2. Background -->
                <section class="bg-black/20 p-4 rounded-3xl border border-slate-800 space-y-4">
                    <div class="flex justify-between items-center">
                        <h3 class="text-cyan-400 font-black text-xs uppercase flex items-center gap-2"><i data-lucide="image" class="w-3 h-3"></i> 2. Background</h3>
                        <button onclick="document.getElementById('bg-upload').click()" class="text-[9px] font-black uppercase bg-slate-800 px-2 py-1 rounded border border-slate-700"><i data-lucide="upload" class="w-3 h-3"></i></button>
                        <input id="bg-upload" type="file" class="hidden" accept="image/*" onchange="handleBgUpload(event)">
                    </div>
                    <div class="flex gap-2 flex-wrap" id="color-palette"></div>
                </section>

                <!-- 3. Assets -->
                <section class="bg-black/20 p-4 rounded-3xl border border-slate-800 space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="text-cyan-400 font-black text-xs uppercase flex items-center gap-2"><i data-lucide="plus-square" class="w-3 h-3"></i> 3. Assets</h3>
                        <button onclick="document.getElementById('asset-upload').click()" class="text-[9px] font-black uppercase bg-slate-800 px-2 py-1 rounded border border-slate-700"><i data-lucide="upload" class="w-3 h-3"></i></button>
                        <input id="asset-upload" type="file" class="hidden" accept="image/*" onchange="handleAssetUpload(event)">
                    </div>
                    <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-hide" id="asset-library"></div>
                </section>

                <!-- 4. Selected Item Controls -->
                <section class="space-y-4 border-t border-slate-800 pt-4">
                    <h3 class="text-cyan-400 font-black text-xs uppercase">4. Selection Controls</h3>
                    <div class="flex gap-2 mb-2">
                        <button onclick="flipSelected()" class="bg-slate-800 p-2 rounded-xl flex-1 flex justify-center hover:bg-slate-700"><i data-lucide="flip-horizontal" class="w-4 h-4"></i></button>
                        <button onclick="deleteSelected()" class="bg-red-900/20 text-red-500 p-2 rounded-xl flex-1 flex justify-center border border-red-900/50 hover:bg-red-900/40"><i data-lucide="trash-2" class="w-4 h-4"></i></button>
                    </div>
                    <div class="space-y-1">
                        <div class="flex justify-between text-[8px] uppercase font-bold text-slate-500"><span>Size</span></div>
                        <input type="range" id="scale-slider" min="0.1" max="4" step="0.1" value="1" oninput="updateSelectedScale(this.value)">
                        <div class="flex justify-between text-[8px] uppercase font-bold text-slate-500"><span>Rotate</span></div>
                        <input type="range" id="rotate-slider" min="-180" max="180" step="1" value="0" oninput="updateSelectedRotation(this.value)">
                    </div>
                </section>

                <section>
                    <h3 class="text-cyan-400 font-black text-xs uppercase mb-2">Dialogue</h3>
                    <textarea id="dialogue-input" oninput="updateSpeech(this.value)" placeholder="SAY SOMETHING..." class="w-full bg-black border-2 border-slate-800 rounded-2xl p-3 text-sm font-black uppercase text-white outline-none h-16 resize-none"></textarea>
                    <button onclick="speakDialogue()" class="w-full mt-2 flex items-center justify-center gap-2 text-[10px] font-black uppercase py-2 rounded bg-slate-800 border border-slate-700 text-slate-300"><i data-lucide="volume-2" class="w-4 h-4"></i> Speak</button>
                </section>

                <button onclick="generateIdea()" class="w-full bg-slate-800 py-3 rounded-2xl text-[10px] font-black uppercase border border-slate-700">💡 Idea Engine</button>
                <button onclick="takeSnap()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 py-4 rounded-2xl text-xl font-black uppercase shadow-xl active:scale-95 transition-all"><i data-lucide="camera" class="inline w-6 h-6 mr-2"></i> SNAP PANEL!</button>
            </div>

            <!-- Viewport Area -->
            <div class="lg:col-span-9 flex flex-col gap-6">
                <div id="viewport-frame">
                    <div id="speech-bubble" class="speech-bubble"></div>
                    <div id="movables-layer" class="absolute inset-0"></div>
                    <div class="absolute bottom-8 right-10 opacity-10 font-black italic text-6xl text-white pointer-events-none uppercase font-comic">KIDOVATE</div>
                    <div id="lore-popup" class="absolute bottom-6 left-6 right-6 bg-cyan-500 text-black p-4 rounded-3xl border-4 border-black shadow-2xl hidden flex justify-between items-center z-[101]">
                        <p id="lore-text" class="font-black text-xs uppercase italic pr-4"></p>
                        <button onclick="closeLore()" class="bg-black text-white px-4 py-2 rounded-full font-black text-[10px]">OK</button>
                    </div>
                </div>

                <div class="bg-slate-900 border border-slate-800 rounded-[50px] p-8 shadow-2xl">
                    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-8">
                        <h4 class="font-black uppercase tracking-widest text-sm text-emerald-500 italic">COMIC STRIP REEL</h4>
                        <div class="flex gap-2">
                            <button onclick="resetEverything()" class="text-[10px] font-black text-red-500 uppercase px-4 py-3 hover:bg-red-500/10 rounded-2xl transition-colors">Reset Studio</button>
                            <button onclick="shareComic()" class="bg-blue-600 hover:bg-blue-500 px-6 py-3 rounded-2xl text-[10px] font-black uppercase shadow-xl flex items-center gap-2 transition-all active:scale-95">
                                <i data-lucide="share-2" class="w-4 h-4"></i> Share Story
                            </button>
                        </div>
                    </div>
                    <div id="strip-reel-container" class="flex gap-6 overflow-x-auto pb-6 scrollbar-hide min-h-[200px]">
                        <div id="empty-msg" class="w-full py-16 text-center border-4 border-dashed border-slate-800 rounded-[40px] opacity-20 uppercase font-black italic">Snap your first panel!</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- GALLERY TAB -->
        <div id="content-brag" class="hidden-tab py-24 text-center space-y-12 animate-in fade-in">
            <h2 class="text-7xl font-black text-white font-comic uppercase tracking-tighter">The Gallery</h2>
            <div id="gallery-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-10">
                <div class="col-span-full bg-slate-900 border-4 border-dashed border-slate-800 rounded-[60px] p-20 opacity-30 italic font-black uppercase text-2xl text-slate-600">Coming Soon... Your Comic Here!</div>
            </div>
        </div>

        <!-- ABOUT TAB -->
        <div id="content-about" class="hidden-tab max-w-3xl mx-auto py-16 bg-slate-900 p-12 rounded-[60px] border border-slate-800 shadow-2xl space-y-6">
            <h2 id="about-title" class="text-6xl font-black italic text-white mb-8 uppercase font-comic"></h2>
            <p id="about-desc" class="text-slate-300 font-bold leading-loose text-lg"></p>
            <div class="h-px bg-slate-800 my-8"></div>
            <p id="about-mission" class="text-cyan-500 font-black uppercase text-sm italic"></p>
        </div>
    </main>

    <script>
        const ADMIN_CONFIG = {
            about: {
                title: "Hardware Mastered. Stories Engaged.",
                description: "Kidovate is the home for Dummy 13 creators. We believe that building the physical toy is only the first half of the fun. This studio is where your builds come to life.",
                mission: "Empowering young engineers to become digital storytellers."
            },
            ideaEngine: {
                who: ["Blue Guardian", "Rogue Dummy 13", "Armor Master", "Robot Scout", "Golden Hero", "Commander Frame"],
                action: ["is searching for", "just discovered", "is protecting", "wants to trade", "is practicing moves with", "is hiding from"],
                what: ["the legendary 3D print", "a micro-chip", "spare armor", "secret instructions", "a human battery", "forbidden filament"],
                location: ["on the Moon.", "in the bedroom.", "inside the printer.", "at the disco.", "in the kitchen.", "under the bed."]
            }
        };

        const HERO_POSES = [
            { id: 'p1', svg: `<svg viewBox="0 0 100 150"><circle cx="50" cy="22" r="6" fill="#06f"/><rect x="47" y="28" width="6" height="50" fill="#06f"/><path d="M40 78 L40 130 M60 78 L60 130 M30 40 L15 80 M70 40 L85 80" stroke-width="6" stroke="#06f" fill="none"/><path d="M38 35 Q50 32 62 35 L64 75 Q50 78 36 75 Z" fill="#000"/><path d="M45 18 L55 18 L58 32 L42 32 Z" fill="#000"/><rect x="35" y="85" width="12" height="25" rx="3" fill="#000"/><rect x="53" y="85" width="12" height="25" rx="3" fill="#000"/></svg>` },
            { id: 'p2', svg: `<svg viewBox="0 0 100 150"><path d="M50 80 L30 110 L45 130 M50 80 L70 100 L60 135 M45 45 L20 35 L30 15 M55 45 L85 60 L75 80" stroke-width="7" stroke="#06f" fill="none"/><circle cx="62" cy="28" r="7" fill="#06f"/><rect x="40" y="40" width="24" height="40" rx="4" transform="rotate(-10 50 60)" fill="#000"/><rect x="25" y="105" width="14" height="25" transform="rotate(30 30 115)" fill="#000"/><rect x="65" y="95" width="14" height="25" transform="rotate(-20 70 105)" fill="#000"/></svg>` },
            { id: 'p3', svg: `<svg viewBox="0 0 100 150"><path d="M40 85 L40 125 M55 85 L95 75 L95 90 M35 50 L10 60 L20 80 M60 50 L85 40 L90 20" stroke-width="8" stroke="#06f" fill="none"/><circle cx="55" cy="30" r="10" fill="#06f"/><rect x="35" y="45" width="24" height="40" rx="4" transform="rotate(10 45 65)" fill="#000"/></svg>` }
        ];

        const ASSETS = [
            { id: 'sword', svg: `<svg viewBox="0 0 100 100"><path d="M50 10 L60 80 L50 90 L40 80 Z" fill="#94a3b8" stroke="black" stroke-width="2"/></svg>` },
            { id: 'shield', svg: `<svg viewBox="0 0 100 100"><path d="M20 20 Q50 10 80 20 L75 70 Q50 90 25 70 Z" fill="#1e293b" stroke="#06b6d4" stroke-width="4"/></svg>` },
            { id: 'pow', svg: `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="40" fill="#ef4444" stroke="black" stroke-width="3"/><text x="50" y="58" text-anchor="middle" font-family="Bangers" font-size="22" fill="white" font-weight="bold">POW</text></svg>` }
        ];

        let selectedEl = null;
        let panels = [];
        let dragOffset = { x: 0, y: 0 };
        let activePointerId = null;
        let highestZ = 100;

        function init() {
            lucide.createIcons();
            loadAbout();
            setupColorPalette();
            setupAssetLibrary();
            
            // Global move/up handlers
            window.addEventListener('pointermove', handlePointerMove);
            window.addEventListener('pointerup', handlePointerUp);
        }

        // --- NAVIGATION ---
        function switchTab(id) {
            document.querySelectorAll('.btn-tab').forEach(b => b.classList.remove('active'));
            document.getElementById('tab-' + id).classList.add('active');
            ['studio', 'brag', 'about'].forEach(t => document.getElementById('content-' + t).classList.add('hidden-tab'));
            document.getElementById('content-' + id).classList.remove('hidden-tab');
        }

        // --- DRAGGING CORE ---
        function onMovablePointerDown(e) {
            const el = e.currentTarget;
            selectElement(el);
            
            // Bring to front
            highestZ++;
            el.style.zIndex = highestZ;

            activePointerId = e.pointerId;
            const rect = el.getBoundingClientRect();
            dragOffset.x = e.clientX - rect.left;
            dragOffset.y = e.clientY - rect.top;
            
            el.setPointerCapture(e.pointerId);
            e.stopPropagation();
        }

        function handlePointerMove(e) {
            if (!selectedEl || activePointerId === null || e.pointerId !== activePointerId) return;
            
            const viewport = document.getElementById('viewport-frame').getBoundingClientRect();
            const x = e.clientX - viewport.left - dragOffset.x;
            const y = e.clientY - viewport.top - dragOffset.y;
            
            selectedEl.style.left = x + 'px';
            selectedEl.style.top = y + 'px';
        }

        function handlePointerUp(e) { activePointerId = null; }

        function selectElement(el) {
            if (selectedEl) selectedEl.classList.remove('selected');
            selectedEl = el;
            selectedEl.classList.add('selected');
            
            // Sync UI Sliders
            const s = parseFloat(el.dataset.scale || 1);
            const r = parseInt(el.dataset.rotate || 0);
            document.getElementById('scale-slider').value = s;
            document.getElementById('rotate-slider').value = r;
        }

        // --- CREATION ---
        function createMovable(content, type = 'hero') {
            const layer = document.getElementById('movables-layer');
            const el = document.createElement('div');
            el.className = "movable";
            if (type === 'asset') el.style.width = "120px", el.style.height = "120px";
            
            el.innerHTML = content;
            el.dataset.scale = 1;
            el.dataset.rotate = 0;
            el.dataset.flipped = "false";
            
            el.style.left = "30%";
            el.style.top = "30%";
            
            el.onpointerdown = onMovablePointerDown;
            el.ondblclick = () => el.remove();
            
            layer.appendChild(el);
            selectElement(el);
            applyTransform(el);
        }

        function handleHeroUpload(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => createMovable(`<img src="${ev.target.result}" class="max-w-full max-h-full drop-shadow-2xl">`);
            r.readAsDataURL(f);
        }

        function handleAssetUpload(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => createMovable(`<img src="${ev.target.result}" class="max-w-full max-h-full object-contain">`, 'asset');
            r.readAsDataURL(f);
        }

        function handleBgUpload(e) {
            const f = e.target.files[0];
            if (!f) return;
            const r = new FileReader();
            r.onload = (ev) => {
                const stage = document.getElementById('viewport-frame');
                stage.style.backgroundImage = `url(${ev.target.result})`;
                stage.style.backgroundSize = "cover";
                stage.style.backgroundPosition = "center";
            };
            r.readAsDataURL(f);
        }

        // --- CONTROLS ---
        function updateSelectedScale(v) { if(selectedEl) { selectedEl.dataset.scale = v; applyTransform(selectedEl); } }
        function updateSelectedRotation(v) { if(selectedEl) { selectedEl.dataset.rotate = v; applyTransform(selectedEl); } }
        function flipSelected() { 
            if(selectedEl) { 
                selectedEl.dataset.flipped = selectedEl.dataset.flipped === "true" ? "false" : "true"; 
                applyTransform(selectedEl); 
            } 
        }
        function deleteSelected() { if(selectedEl) { selectedEl.remove(); selectedEl = null; } }

        function applyTransform(el) {
            const s = el.dataset.scale;
            const r = el.dataset.rotate;
            const f = el.dataset.flipped === "true" ? -1 : 1;
            el.style.transform = `scale(${s * f}, ${s}) rotate(${r}deg)`;
        }

        // --- ACTIONS ---
        function updateSpeech(v) {
            const b = document.getElementById('speech-bubble');
            b.innerText = v;
            b.style.display = v.trim() ? 'block' : 'none';
        }

        function speakDialogue() {
            const t = document.getElementById('dialogue-input').value;
            if (!t.trim()) return;
            const u = new SpeechSynthesisUtterance(t);
            u.pitch = 0.5;
            window.speechSynthesis.speak(u);
        }

        async function takeSnap() {
            const f = document.getElementById('viewport-frame');
            const c = await html2canvas(f, { backgroundColor: null, scale: 2 });
            const img = c.toDataURL("image/png");
            
            const reel = document.getElementById('strip-reel-container');
            const empty = document.getElementById('empty-msg');
            if (empty) empty.remove();
            
            const div = document.createElement('div');
            div.className = "panel-thumb";
            div.innerHTML = `<img src="${img}" class="w-full h-full object-cover">`;
            reel.appendChild(div);
            panels.push(img);
            
            document.getElementById('dialogue-input').value = '';
            updateSpeech('');
        }

        async function shareComic() {
            if (panels.length === 0) return;
            const reel = document.getElementById('strip-reel-container');
            const c = await html2canvas(reel, { backgroundColor: '#000000', scale: 2 });
            const dataUrl = c.toDataURL("image/png");
            const blob = await (await fetch(dataUrl)).blob();
            const file = new File([blob], 'kidovate-comic.png', { type: 'image/png' });

            if (navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
                await navigator.share({ files: [file], title: 'My Kidovate Comic!' });
            } else {
                const l = document.createElement('a');
                l.download = `Kidovate_Story.png`;
                l.href = dataUrl;
                l.click();
            }
        }

        function resetEverything() {
            if (confirm("Reset everything? Stage, background, and reel will be cleared.")) {
                panels = [];
                document.getElementById('strip-reel-container').innerHTML = '<div id="empty-msg" class="w-full py-16 text-center border-4 border-dashed border-slate-800 rounded-[40px] opacity-20 uppercase font-black italic">Snap your first panel!</div>';
                document.getElementById('movables-layer').innerHTML = '';
                document.getElementById('viewport-frame').style.backgroundImage = 'none';
                document.getElementById('viewport-frame').style.backgroundColor = '#1e293b';
                selectedEl = null;
            }
        }

        function generateIdea() {
            const p = ADMIN_CONFIG.ideaEngine;
            const m = `${p.who[Math.floor(Math.random()*p.who.length)]} ${p.action[Math.floor(Math.random()*p.action.length)]} ${p.what[Math.floor(Math.random()*p.what.length)]} ${p.location[Math.floor(Math.random()*p.location.length)]}`;
            document.getElementById('lore-text').innerText = m;
            document.getElementById('lore-popup').classList.remove('hidden');
        }

        function closeLore() { document.getElementById('lore-popup').classList.add('hidden'); }

        function setupColorPalette() {
            const container = document.getElementById('color-palette');
            ['#1e293b', '#000000', '#ffffff', '#ffcc00', '#ef4444', '#06b6d4'].forEach(c => {
                const b = document.createElement('button');
                b.className = "w-6 h-6 rounded-lg border-2 border-slate-700 hover:border-white";
                b.style.background = c;
                b.onclick = () => {
                    const f = document.getElementById('viewport-frame');
                    f.style.backgroundImage = 'none';
                    f.style.backgroundColor = c;
                };
                container.appendChild(b);
            });
        }

        function setupAssetLibrary() {
            const lib = document.getElementById('asset-library');
            const gallery = document.getElementById('hero-gallery');
            HERO_POSES.forEach(p => {
                const b = document.createElement('button');
                b.className = "shrink-0 w-16 h-16 rounded-2xl border-2 border-slate-800 p-1 bg-black hover:border-cyan-500";
                b.innerHTML = p.svg;
                b.onclick = () => createMovable(p.svg);
                gallery.appendChild(b);
            });
            ASSETS.forEach(a => {
                const b = document.createElement('button');
                b.className = "shrink-0 w-12 h-12 rounded-xl bg-black border border-slate-800 p-2 hover:border-cyan-500";
                b.innerHTML = a.svg;
                b.onclick = () => createMovable(a.svg, 'asset');
                lib.appendChild(b);
            });
        }

        function loadAbout() {
            document.getElementById('about-title').innerText = ADMIN_CONFIG.about.title;
            document.getElementById('about-desc').innerText = ADMIN_CONFIG.about.description;
            document.getElementById('about-mission').innerText = ADMIN_CONFIG.about.mission;
        }

        window.onload = init;
    </script>
</body>
</html>
